name: RimV Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Dry-run release tag to validate, for example v0.1.0-beta'
        required: false
        default: 'v0.1.0-beta'

permissions:
  contents: read

concurrency:
  # Tags and manual dry-run tags are isolated so one release never cancels another.
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate tag and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            publish=false
          else
            tag="${GITHUB_REF_NAME}"
            publish=true
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          version="${tag#v}"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "Tag $tag does not match Cargo workspace version $manifest_version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  quality:
    name: Release quality (Linux x64)
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Tagged commits receive one full quality gate. Keep native Sherpa
          # build output out of the cache so its sibling libraries stay in sync.
          cache-targets: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

  package:
    name: Package distributions (${{ matrix.name }})
    needs:
      - validate
      - quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            artifact: macos-arm64
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26.3
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # See the release quality job: cached target artifacts can retain a
          # link search path to a missing Sherpa native-library directory.
          cache-targets: false

      - name: Build release binaries once
        run: cargo build --release --locked -p capture-cli -p rimv

      - name: Stage and archive distributions
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          for kind in capture transcribe server; do
            staged="$(RIMV_STAGE_SKIP_BUILD=1 scripts/stage-distribution.sh "$kind")"
            test -d "$staged"
            archive="$(scripts/archive-distribution.sh "$kind" "$staged")"
            test -s "$archive"
            test -s "$archive.contents.txt"
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rimv-${{ matrix.artifact }}-packages
          path: target/release-artifacts
          if-no-files-found: error

  windows-desktop:
    name: Package Windows desktop installer
    needs:
      - validate
      - quality
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Import optional release signing certificate
        if: github.event_name == 'push'
        id: windows-signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host 'No Windows signing certificate is configured; the installer will be unsigned.'
            exit 0
          }
          if (-not $env:WINDOWS_SIGNING_PASSWORD) {
            throw 'WINDOWS_SIGNING_PASSWORD must be set when a signing certificate is configured.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'rimv-windows-signing.pfx'
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          try {
            $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object { $_.HasPrivateKey } |
              Select-Object -First 1
            if (-not $certificate) {
              throw 'The imported Windows signing certificate has no private key.'
            }
            "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
            "certificate_path=$certificatePath" >> $env:GITHUB_OUTPUT
            "enabled=true" >> $env:GITHUB_OUTPUT
          } catch {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
            throw
          }

      - name: Prepare Windows runtime DLLs
        shell: pwsh
        run: ./scripts/windows/prepare-windows-runtime.ps1

      - name: Build Windows desktop installer
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ steps.windows-signing.outputs.enabled }}
          SIGNING_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
          SIGNING_CERTIFICATE_PATH: ${{ steps.windows-signing.outputs.certificate_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/windows
          try {
            if ($env:SIGNING_ENABLED -eq 'true') {
              $signingConfig = Join-Path $env:RUNNER_TEMP 'rimv-tauri-signing.json'
              $configuration = @{
                bundle = @{
                  windows = @{
                    certificateThumbprint = $env:SIGNING_THUMBPRINT
                    digestAlgorithm = 'sha256'
                    timestampUrl = 'http://timestamp.digicert.com'
                  }
                }
              } | ConvertTo-Json -Depth 5
              Set-Content -LiteralPath $signingConfig -Value $configuration -Encoding utf8
              cargo tauri build --config $signingConfig
              if ($LASTEXITCODE -ne 0) { throw 'Tauri failed to build or sign the Windows installer.' }
            } else {
              cargo tauri build
              if ($LASTEXITCODE -ne 0) { throw 'Tauri failed to build the Windows installer.' }
            }
          } finally {
            Pop-Location
            if ($env:SIGNING_CERTIFICATE_PATH) {
              Remove-Item -LiteralPath $env:SIGNING_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
            }
            if ($env:SIGNING_THUMBPRINT) {
              Remove-Item -Path "Cert:\CurrentUser\My\$env:SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            }
          }

          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $installer = Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) {
            throw 'Tauri did not produce the expected NSIS setup executable.'
          }
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'target/release-artifacts'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          $artifactName = "RimV-$version-windows-x64-setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $artifactDirectory $artifactName)
          Get-FileHash -LiteralPath (Join-Path $artifactDirectory $artifactName) -Algorithm SHA256 | Format-List

      - name: Upload Windows desktop installer
        uses: actions/upload-artifact@v6
        with:
          name: rimv-windows-x64-desktop-installer
          path: target/release-artifacts/*.exe
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs:
      - validate
      - package
      - windows-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v6
        with:
          path: target/release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd target/release-artifacts
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' \) -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v6
        with:
          name: SHA256SUMS
          path: target/release-artifacts/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - checksums
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          path: target/release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: rimv ${{ needs.validate.outputs.tag }}
          body_path: RELEASES.md
          files: |
            target/release-artifacts/*.tar.gz
            target/release-artifacts/*.zip
            target/release-artifacts/*.exe
            target/release-artifacts/SHA256SUMS
