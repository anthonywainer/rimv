name: RimV Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Candidate tag (dry run; does not publish)'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  validate:
    name: Validate release identity and manual evidence
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate tag, version and release evidence
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$REQUESTED_TAG"
            publish=false
          else
            tag="$GITHUB_REF_NAME"
            publish=true
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo "A new prerelease tag is required: $tag" >&2
            exit 1
          fi
          if [[ "$tag" == v0.1.0-beta || "$tag" == v0.1.0-beta.1 ]]; then
            echo "Historical release tag $tag cannot be reused." >&2
            exit 1
          fi
          version="${tag#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$version" = "$manifest_version" || { echo "Tag and Cargo workspace version differ." >&2; exit 1; }
          test "$version" = "$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' apps/windows-native/RimV.Windows.csproj | head -n 1)" || { echo "WinUI version differs from the release tag." >&2; exit 1; }
          commit="$(git rev-parse HEAD)"

          if [[ "$publish" == true ]]; then
            evidence="docs/native-windows-validation/$tag.md"
            test -f "$evidence" || { echo "Manual Windows acceptance evidence is missing: $evidence" >&2; exit 1; }
            for check in installer tray keyboard_scaling microphone system_audio both_audio recordings_exports shutdown; do
              grep -qx "$check: PASS" "$evidence" || { echo "Manual acceptance item $check has not passed in $evidence" >&2; exit 1; }
            done
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists; refusing to modify a historical release." >&2
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  prior-validation:
    name: Require CI with native installer validation for this commit
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      native_run_id: ${{ steps.runs.outputs.native_run_id }}
      native_run_url: ${{ steps.runs.outputs.native_run_url }}

    steps:
      - name: Locate completed main-branch validations
        id: runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          find_run() {
            local workflow="$1"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$COMMIT&status=success&per_page=100" \
              | jq -r --arg commit "$COMMIT" '[.workflow_runs[] | select(.head_sha == $commit and .head_branch == "main" and (.event == "push" or .event == "workflow_dispatch"))] | first | .id // empty'
          }
          ci_run="$(find_run ci.yml)"
          test -n "$ci_run" || { echo "No successful main-branch CI run exists for $COMMIT." >&2; exit 1; }
          artifact="rimv-native-windows-x64-$COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run/artifacts?per_page=100" \
            | jq -e --arg name "$artifact" 'any(.artifacts[]; .name == $name and (.expired | not))' >/dev/null \
            || { echo "CI run $ci_run has no retained native Windows installer artifact. Re-run CI manually for $COMMIT." >&2; exit 1; }
          echo "native_run_id=$ci_run" >> "$GITHUB_OUTPUT"
          echo "native_run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$ci_run" >> "$GITHUB_OUTPUT"
          echo "CI and native package run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$ci_run" >> "$GITHUB_STEP_SUMMARY"

  macos-package:
    name: Preserve macOS arm64 release packages
    needs:
      - validate
      - prior-validation
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Build macOS release binaries once
        run: cargo build --release --locked -p capture-cli -p rimv

      - name: Stage and archive macOS distributions
        shell: bash
        run: |
          set -euo pipefail
          for kind in capture transcribe server; do
            staged="$(RIMV_STAGE_SKIP_BUILD=1 scripts/stage-distribution.sh "$kind")"
            test -d "$staged"
            archive="$(scripts/archive-distribution.sh "$kind" "$staged")"
            test -s "$archive"
            test -s "$archive.contents.txt"
          done

      - name: Upload macOS packages
        uses: actions/upload-artifact@v6
        with:
          name: rimv-macos-arm64-packages
          path: target/release-artifacts
          if-no-files-found: error

  assemble:
    name: Verify exact native installer and assemble release assets
    needs:
      - validate
      - prior-validation
      - macos-package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download tested native Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          RUN_ID: ${{ needs.prior-validation.outputs.native_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-validated"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "rimv-native-windows-x64-$COMMIT" --dir "$RUNNER_TEMP/native-validated"

      - name: Verify artifact identity, checksum and native-only contents
        shell: bash
        env:
          COMMIT: ${{ needs.validate.outputs.commit }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/native-validated"
          installer="RimV-$VERSION-windows-x64-setup.exe"
          manifest="RimV-$VERSION-windows-x64-manifest.json"
          checksums="RimV-$VERSION-windows-x64-SHA256SUMS.txt"
          test -s "$installer" && test -s "$manifest" && test -s "$checksums"
          test "$(find . -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')" = 1
          tr -d '\r' < "$checksums" > "$RUNNER_TEMP/native-checksums.txt"
          sha256sum --check "$RUNNER_TEMP/native-checksums.txt"
          jq -e --arg commit "$COMMIT" --arg version "$VERSION" \
            '.buildCommit == $commit and .version == $version and .installerFormat == "NSIS" and .sharedRustLibrary == "rimv_core_ffi.dll"' "$manifest"
          if find . -maxdepth 1 -type f | grep -Ei '(tauri|html|webview|\.zip$)' ; then
            echo 'A legacy Windows artifact was found in the native package run.' >&2
            exit 1
          fi

      - name: Download macOS release packages
        uses: actions/download-artifact@v6
        with:
          name: rimv-macos-arm64-packages
          path: target/release-artifacts

      - name: Assemble exact release assets and checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          VALIDATION_RUN: ${{ needs.prior-validation.outputs.native_run_url }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/native-validated/RimV-$VERSION-windows-x64-setup.exe" target/release-artifacts/
          cd target/release-artifacts
          for kind in capture transcribe server; do
            test -s "rimv-$kind-$RELEASE_TAG-macos-arm64.tar.gz"
          done
          sha256sum \
            "rimv-capture-$RELEASE_TAG-macos-arm64.tar.gz" \
            "rimv-transcribe-$RELEASE_TAG-macos-arm64.tar.gz" \
            "rimv-server-$RELEASE_TAG-macos-arm64.tar.gz" \
            "RimV-$VERSION-windows-x64-setup.exe" > SHA256SUMS
          test -s SHA256SUMS
          sha256sum --check SHA256SUMS
          cat > "$RUNNER_TEMP/rimv-native-release-notes.md" <<EOF
          # RimV $RELEASE_TAG — native Windows prerelease

          Windows x64: install RimV-$VERSION-windows-x64-setup.exe. This is the native WinUI 3 application backed by the shared Rust core. Models are downloaded by the app after installation. The installer is currently unsigned.

          The native installer passed automated Rust/.NET tests, package dependency checks, and clean-runner install, startup, reinstall, uninstall and user-data preservation checks in [the validation workflow]($VALIDATION_RUN). Interactive GUI and physical audio results are recorded in the committed manual acceptance report for this tag. See [installation instructions](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/docs/windows-native-installation.md).

          macOS arm64 Capture, Transcribe and Server archives remain available. The historical HTML/Tauri Windows releases remain unchanged.
          EOF

      - name: Upload dry-run release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: rimv-native-release-candidate-${{ needs.validate.outputs.commit }}
          path: target/release-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Publish new GitHub prerelease
        if: needs.validate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: rimv ${{ needs.validate.outputs.tag }}
          prerelease: true
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/rimv-native-release-notes.md
          files: |
            target/release-artifacts/rimv-capture-${{ needs.validate.outputs.tag }}-macos-arm64.tar.gz
            target/release-artifacts/rimv-transcribe-${{ needs.validate.outputs.tag }}-macos-arm64.tar.gz
            target/release-artifacts/rimv-server-${{ needs.validate.outputs.tag }}-macos-arm64.tar.gz
            target/release-artifacts/RimV-${{ needs.validate.outputs.version }}-windows-x64-setup.exe
            target/release-artifacts/SHA256SUMS
