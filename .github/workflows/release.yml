name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Dry-run release tag to validate, for example v0.1.0-beta'
        required: false
        default: 'v0.1.0-beta'

permissions:
  contents: read

concurrency:
  # Tags and manual dry-run tags are isolated so one release never cancels another.
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate tag and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            publish=false
          else
            tag="${GITHUB_REF_NAME}"
            publish=true
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          version="${tag#v}"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "Tag $tag does not match Cargo workspace version $manifest_version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  quality:
    name: Release quality (Linux x64)
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Tagged commits receive one full quality gate. Keep native Sherpa
          # build output out of the cache so its sibling libraries stay in sync.
          cache-targets: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

  package:
    name: Package distributions (${{ matrix.name }})
    needs:
      - validate
      - quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            artifact: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26.3
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # See the release quality job: cached target artifacts can retain a
          # link search path to a missing Sherpa native-library directory.
          cache-targets: false

      - name: Build release binaries once
        run: cargo build --release --locked -p capture-cli -p rimv

      - name: Stage and archive distributions
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          for kind in capture transcribe server; do
            staged="$(RIMV_STAGE_SKIP_BUILD=1 scripts/stage-distribution.sh "$kind")"
            test -d "$staged"
            archive="$(scripts/archive-distribution.sh "$kind" "$staged")"
            test -s "$archive"
            test -s "$archive.contents.txt"
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rimv-${{ matrix.artifact }}-packages
          path: target/release-artifacts
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs:
      - validate
      - package
    runs-on: ubuntu-latest

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v6
        with:
          path: target/release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd target/release-artifacts
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v6
        with:
          name: SHA256SUMS
          path: target/release-artifacts/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - checksums
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          path: target/release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: rimv ${{ needs.validate.outputs.tag }}
          body_path: RELEASES.md
          files: |
            target/release-artifacts/*.tar.gz
            target/release-artifacts/*.zip
            target/release-artifacts/SHA256SUMS
