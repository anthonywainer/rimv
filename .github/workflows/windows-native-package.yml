name: RimV Native Windows Package

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-validation:
    name: Fast native Windows PR validation
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache

    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust and MSVC
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: native-windows-x64
          add-job-id-key: false

      - name: Cache Rust compiler outputs
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.105

      - name: Cache locked NuGet packages
        id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-windows-2025-net10-${{ hashFiles('apps/windows-native/RimV.Windows.csproj', 'apps/windows-native/packages.lock.json', 'apps/windows-native.tests/packages.lock.json', 'apps/windows-native.integration-tests/packages.lock.json') }}

      - name: Check Rust formatting and lints
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed.' }
          cargo clippy --locked -p audio-capture -p engine-runtime -p model-manager -p rimv-ffi -p speech-transcription --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Shared Rust linting failed.' }

      - name: Test shared Rust core
        run: cargo test --locked -p app-paths -p audio-core -p audio-capture -p engine-protocol -p engine-runtime -p model-manager -p rimv-ffi -p speech-transcription

      - name: Restore locked .NET projects
        shell: pwsh
        run: |
          dotnet restore apps/windows-native.tests/RimV.Windows.UnitTests.csproj --locked-mode -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw '.NET unit test restore failed.' }
          dotnet restore apps/windows-native/RimV.Windows.csproj --runtime win-x64 -p:Platform=x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:BuildRimvCore=false -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'WinUI restore failed.' }

      - name: Test Windows application coordination
        run: dotnet test apps/windows-native.tests/RimV.Windows.UnitTests.csproj --configuration Release --no-restore -p:NuGetAudit=false

      - name: Compile the native WinUI frontend
        run: dotnet build apps/windows-native/RimV.Windows.csproj --configuration Release --no-restore --runtime win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:BuildRimvCore=false -p:NuGetAudit=false

      - name: Report cache use
        if: always()
        shell: pwsh
        run: |
          "NuGet cache hit: ${{ steps.nuget-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          if ($env:SCCACHE_PATH) { & $env:SCCACHE_PATH --show-stats }

  package:
    name: Build and inspect native x64 installer
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache

    steps:
      - uses: actions/checkout@v5

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: native-windows-x64
          add-job-id-key: false

      - name: Cache Rust compiler outputs
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.105

      - name: Cache locked NuGet packages
        id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-windows-2025-net10-${{ hashFiles('apps/windows-native/RimV.Windows.csproj', 'apps/windows-native/packages.lock.json', 'apps/windows-native.tests/packages.lock.json', 'apps/windows-native.integration-tests/packages.lock.json') }}

      - name: Install pinned NSIS compiler
        shell: pwsh
        run: |
          $installed = choco list --exact nsis --limit-output 2>$null
          if (-not (@($installed) -contains 'nsis|3.11.0')) {
            choco install nsis --version=3.11.0 --allow-downgrade --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS 3.11.0 installation failed.' }
          }

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test shared Rust core and FFI
        run: cargo test --locked -p app-paths -p audio-core -p audio-capture -p engine-protocol -p engine-runtime -p model-manager -p rimv-ffi -p speech-transcription

      - name: Restore locked .NET test projects
        shell: pwsh
        run: |
          dotnet restore apps/windows-native.tests/RimV.Windows.UnitTests.csproj --locked-mode -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw '.NET unit test restore failed.' }
          dotnet restore apps/windows-native.integration-tests/RimV.Windows.IntegrationTests.csproj --locked-mode -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw '.NET FFI integration restore failed.' }

      - name: Test portable Windows application coordination
        run: dotnet test apps/windows-native.tests/RimV.Windows.UnitTests.csproj --configuration Release --no-restore -p:NuGetAudit=false

      - name: Build the self-contained WinUI and shared Rust payload
        shell: pwsh
        env:
          RIMV_IDENTITY_CERTIFICATE_BASE64: ${{ secrets.RIMV_IDENTITY_CERTIFICATE_BASE64 }}
          RIMV_IDENTITY_CERTIFICATE_PASSWORD: ${{ secrets.RIMV_IDENTITY_CERTIFICATE_PASSWORD }}
          RIMV_ALLOW_EPHEMERAL_IDENTITY_CERTIFICATE: 'true'
        run: ./scripts/windows/build-native-package.ps1

      - name: Publish native Windows size audit
        shell: pwsh
        run: |
          $audit = Get-ChildItem target/windows-native-package/artifacts/*-size-audit.md | Select-Object -First 1
          if (-not $audit) { throw 'The native Windows size audit was not generated.' }
          Get-Content $audit.FullName >> $env:GITHUB_STEP_SUMMARY

      - name: Test the built Windows Rust ABI through C#
        shell: pwsh
        env:
          RIMV_CORE_FFI_DLL: ${{ github.workspace }}\target\windows-native-package\cargo-target\x86_64-pc-windows-msvc\release\rimv_core_ffi.dll
        run: dotnet test apps/windows-native.integration-tests/RimV.Windows.IntegrationTests.csproj --configuration Release --no-restore -p:NuGetAudit=false

      - name: Verify production payload and native dependencies
        shell: pwsh
        run: |
          $manifest = Get-ChildItem target/windows-native-package/artifacts/*-manifest.json | Select-Object -First 1
          if (-not $manifest) { throw 'The package manifest was not generated.' }
          ./apps/windows-native.packaging-tests/Test-NativePackage.ps1 `
            -Mode Payload `
            -ManifestPath $manifest.FullName `
            -PayloadDirectory (Join-Path $env:GITHUB_WORKSPACE 'target/windows-native-package/payload')

      - name: Report cache use and package identity
        if: always()
        shell: pwsh
        run: |
          "NuGet cache hit: ${{ steps.nuget-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY
          "Build commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          if ($env:SCCACHE_PATH) { & $env:SCCACHE_PATH --show-stats }

      - name: Upload exact native installer for fresh-runner validation
        uses: actions/upload-artifact@v6
        with:
          name: rimv-native-windows-x64-${{ github.sha }}
          path: target/windows-native-package/artifacts/*
          if-no-files-found: error
          retention-days: 14

  installer-lifecycle:
    name: Install and uninstall the exact tested installer
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Download the build job artifact
        uses: actions/download-artifact@v6
        with:
          name: rimv-native-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}\rimv-native-artifact

      - name: Install to a path containing spaces, launch, reinstall and uninstall
        shell: pwsh
        run: |
          $manifest = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'rimv-native-artifact/*-manifest.json') | Select-Object -First 1
          $installer = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'rimv-native-artifact/*-setup.exe') | Select-Object -First 1
          if (-not $manifest -or -not $installer) { throw 'The downloaded installer or manifest is missing.' }
          $publisherCertificate = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'rimv-native-artifact/*-identity-publisher.cer') | Select-Object -First 1
          if (-not $publisherCertificate) { throw 'The identity package publisher certificate is missing.' }
          Import-Certificate -FilePath $publisherCertificate.FullName -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $publisher = [Security.Cryptography.X509Certificates.X509Certificate2]::new($publisherCertificate.FullName)
          $trustedPublisher = Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object Thumbprint -eq $publisher.Thumbprint | Select-Object -First 1
          if (-not $trustedPublisher) { throw 'The publisher certificate import did not appear in LocalMachine TrustedPeople.' }
          $trustProbeDirectory = Join-Path $env:RUNNER_TEMP 'RimV Identity Trust Probe'
          New-Item -ItemType Directory -Path $trustProbeDirectory -Force | Out-Null
          Copy-Item -LiteralPath $publisherCertificate.FullName -Destination (Join-Path $trustProbeDirectory 'RimV.Identity.cer')
          $identityScript = Join-Path $env:GITHUB_WORKSPACE 'apps/windows-native/packaging/Register-Identity.ps1'
          & (Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe') -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $identityScript -Action CheckPublisherTrust -InstallLocation $trustProbeDirectory
          if ($LASTEXITCODE -ne 0) { throw "The installer identity trust check rejected the imported certificate (exit $LASTEXITCODE)." }
          Write-Host ("Publisher trust preflight passed for thumbprint {0}." -f $publisher.Thumbprint)
          $installDirectory = Join-Path $env:RUNNER_TEMP 'RimV Native Windows Install With Spaces'
          try {
            ./apps/windows-native.packaging-tests/Test-NativePackage.ps1 `
              -Mode Installer `
              -ManifestPath $manifest.FullName `
              -InstallerPath $installer.FullName `
              -InstallDirectory $installDirectory
          }
          catch {
            $failure = $_
            if ($failure.Exception.Message -eq 'Uninstall left the application executable installed.') {
              $appPath = Join-Path $installDirectory 'RimV.Windows.exe'
              $startMenuLink = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::Programs)) 'RimV\RimV Native Windows.lnk'
              $recordingSentinel = Join-Path $env:LOCALAPPDATA 'RimV\recordings\phase4-uninstall-preservation.txt'
              $cleanupDeadline = [DateTime]::UtcNow.AddSeconds(30)
              while (((Test-Path -LiteralPath $installDirectory) -or (Test-Path -LiteralPath $startMenuLink)) -and [DateTime]::UtcNow -lt $cleanupDeadline) {
                Start-Sleep -Milliseconds 500
              }
              if (-not (Test-Path -LiteralPath $installDirectory) -and
                  -not (Test-Path -LiteralPath $startMenuLink) -and
                  (Test-Path -LiteralPath $recordingSentinel)) {
                Write-Host 'PASS: NSIS uninstaller completed file and shortcut cleanup after its launcher returned; user recording data remains.'
                'The NSIS launcher returned before its temporary uninstaller copy completed. CI waited for file and shortcut cleanup and verified user data preservation.' >> $env:GITHUB_STEP_SUMMARY
                return
              }
            }
            Write-Host '--- Native installer failure diagnostics ---'
            $registeredInstallDirectory = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RimV.Native.Windows' -Name InstallLocation -ErrorAction SilentlyContinue).InstallLocation
            Write-Host "Registered install directory: $registeredInstallDirectory"
            $installerTracePath = Join-Path $installDirectory 'RimV.IdentityInstaller.log'
            if (Test-Path -LiteralPath $installerTracePath) {
              Write-Host 'Installer identity flow:'
              Get-Content -LiteralPath $installerTracePath | ForEach-Object { Write-Host "  $_" }
            } else {
              Write-Host 'The installer did not create its identity-flow trace.'
            }
            $identityDiagnosticPath = Join-Path $installDirectory 'RimV.IdentityRegistration.json'
            if (Test-Path -LiteralPath $identityDiagnosticPath) {
              $identityDiagnostic = Get-Content -LiteralPath $identityDiagnosticPath -Raw | ConvertFrom-Json
              Write-Host ("Identity registration failure: {0} {1}" -f $identityDiagnostic.errorType, $identityDiagnostic.hresult)
            }
            $appxEvents = @(Get-WinEvent -FilterHashtable @{
              LogName = 'Microsoft-Windows-AppXDeploymentServer/Operational'
              StartTime = (Get-Date).AddMinutes(-30)
            } -MaxEvents 100 -ErrorAction SilentlyContinue | Where-Object {
              $_.Message -match 'RimV\.Native\.Windows|RimV.Identity'
            } | Select-Object -Last 12)
            if ($appxEvents.Count -gt 0) {
              Write-Host 'Recent AppX deployment diagnostics (event id and HRESULT only):'
              foreach ($event in $appxEvents) {
                $hresults = [regex]::Matches($event.Message, '(?i)0x[0-9a-f]{8}') | ForEach-Object Value | Sort-Object -Unique
                Write-Host ("Event {0}: {1}" -f $event.Id, ($hresults -join ', '))
              }
            }
            # Emit only fixed event names and exception type/HRESULT. Do not
            # publish raw app logs, messages, paths, or transcription data.
            $appLogPath = Join-Path $env:LOCALAPPDATA 'RimV\logs\windows-native.log'
            if (Test-Path -LiteralPath $appLogPath) {
              $entries = @(Get-Content -LiteralPath $appLogPath -Tail 200 | ForEach-Object {
                try { $_ | ConvertFrom-Json } catch { $null }
              } | Where-Object { $null -ne $_ })
              $lastLaunch = -1
              for ($index = 0; $index -lt $entries.Count; $index++) {
                if ($entries[$index].event -eq 'app.launch') { $lastLaunch = $index }
              }
              if ($lastLaunch -ge 0) { $entries = @($entries[$lastLaunch..($entries.Count - 1)]) }
              Write-Host 'Sanitized startup diagnostics (event names and exception type/HRESULT only):'
              foreach ($entry in $entries) {
                $errorType = $null
                $hresult = $null
                if ($entry.error -match '^(?<type>[A-Za-z0-9_.+`]+)(?: \(0x(?<hresult>[0-9A-Fa-f]+)\))?') {
                  $errorType = $Matches.type
                  $hresult = $Matches.hresult
                }
                Write-Host ("{0} {1} {2} {3}" -f $entry.utc, $entry.level, $entry.event, $(if ($errorType) { "$errorType $hresult" } else { '' }))
              }
            } else {
              Write-Host 'The app did not create its local diagnostic log.'
            }
            if (Test-Path -LiteralPath $installDirectory) {
              Get-ChildItem -LiteralPath $installDirectory -Force -Recurse | Select-Object FullName, Length, Attributes | Format-Table -AutoSize | Out-String | Write-Host
              $appPath = Join-Path $installDirectory 'RimV.Windows.exe'
              if (Test-Path -LiteralPath $appPath) {
                try {
                  $stream = [IO.File]::Open($appPath, [IO.FileMode]::Open, [IO.FileAccess]::ReadWrite, [IO.FileShare]::None)
                  $stream.Dispose()
                  Write-Host 'Remaining app executable is not held open by another process.'
                }
                catch {
                  Write-Host "Remaining app executable cannot be opened exclusively: $($_.Exception.Message)"
                }
              }
            }
            Get-CimInstance Win32_Process -Filter "Name = 'RimV.Windows.exe'" | Select-Object ProcessId, ExecutablePath, CommandLine | Format-Table -AutoSize | Out-String | Write-Host
            throw $failure
          }

      - name: Record unattended validation limits
        if: always()
        shell: pwsh
        run: |
          'The installer test verifies checksums, startup process lifetime, dependencies, reinstall, uninstall and user-data preservation.' >> $env:GITHUB_STEP_SUMMARY
          'Interactive tray visibility, graceful UI Quit, visual accessibility and physical audio capture still require Windows desktop/hardware checks.' >> $env:GITHUB_STEP_SUMMARY
