[package]
name = "engine-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
audio-core.workspace = true
audio-capture.workspace = true
engine-protocol = { workspace = true, features = ["serde"] }
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
speech-transcription = { workspace = true, features = ["whisper", "silero-vad", "parakeet"] }
axum.workspace = true
tokio.workspace = true
futures-util.workspace = true

[dev-dependencies]
tempfile = "3"
