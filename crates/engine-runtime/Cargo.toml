[package]
name = "engine-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
apple-speech = ["speech-transcription/apple-speech"]

[[test]]
name = "apple_native_e2e"
path = "tests/apple_native_e2e.rs"
required-features = ["apple-speech"]

[dependencies]
audio-core.workspace = true
audio-capture.workspace = true
engine-protocol = { workspace = true, features = ["serde"] }
app-paths.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
speech-transcription = { workspace = true, features = ["silero-vad", "parakeet"] }
axum.workspace = true
tokio.workspace = true
futures-util.workspace = true

[build-dependencies]
cc = "1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
speech-transcription = { workspace = true, features = ["whisper"] }

[target.'cfg(target_os = "windows")'.dependencies]
speech-transcription = { workspace = true, features = ["whisper"] }

[dev-dependencies]
tempfile = "3"
